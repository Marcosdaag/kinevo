<div class="auth-container">
  <h2>Crear Cuenta</h2>
  
  <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
    <div class="form-group">
      <label for="firstName">Nombre</label>
      <input type="text" id="firstName" formControlName="firstName" placeholder="Tu nombre">
    </div>

    <div class="form-group">
      <label for="lastName">Apellido</label>
      <input type="text" id="lastName" formControlName="lastName" placeholder="Tu apellido">
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" formControlName="email" placeholder="ejemplo@correo.com">
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" formControlName="password" placeholder="Mínimo 6 caracteres">
    </div>

    <button type="submit" [disabled]="registerForm.invalid">Registrarme</button>
  </form>

  <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a></p>
</div>
